name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libasound2-dev libpulse-dev

      # No audio device exists on a CI runner: every test from M3 onwards must
      # work on rendered files only (AGENTS.md 4, CI notes).
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (includes the size gate)
        run: ctest --test-dir build --output-on-failure

      # Memory and CPU are part of the milestone record (AGENTS.md 6.6). The
      # gate already ran above; this pass only puts the numbers in the log and
      # the job summary, the same way the Windows job prints the binary size.
      - name: Report resource usage
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -R '^resource$' -V \
            | grep -- '-- resource' | tee -a "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # AGENTS.md 6.6: the Windows size is part of the milestone record, so it
      # has to land in the log even when the gate passes.
      - name: Report binary size
        shell: pwsh
        run: |
          $size = (Get-Item build/Release/tinyambient.exe).Length
          "{0} bytes ({1} KB)" -f $size, [math]::Floor($size / 1KB)

      - name: Test (includes the size gate)
        run: ctest --test-dir build -C Release --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: clang-format output changes between major versions, so the
      # check must run the same version developers format with.
      - name: Install pinned clang-format
        run: python3 -m pip install clang-format==23.1.3

      - name: Check formatting
        run: scripts/check-format.sh

  sanitize:
    name: ASan/UBSan
    runs-on: ubuntu-24.04
    env:
      # miniaudio is not instrumented, but every allocation it makes is still
      # tracked, so definite leaks are reported even from the device path.
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libasan8 libubsan1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTA_SANITIZE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
